<header><span class="brand">北京市</span></header><main><h1>北京市</h1><p>北京是中华人民共和国的首都，常住人口超过两千万。中文维基百科的北京条目介绍其历史——从元大都、明清都城到现代首都——以及地理、气候、行政区划、交通、教育与文化。</p>
<div class="imgph">[Image: 北京故宫与天安门]</div><section><h2>名胜古迹</h2><p>故宫、天安门广场、长城（八达岭等段）、颐和园、天坛和胡同是北京最具代表性的景观与文化遗产。</p></section></main>
