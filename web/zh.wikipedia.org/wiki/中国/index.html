<header><span class="brand">中国</span></header><main><h1>中国</h1><p><i></i></p><p>中国位于东亚，是世界上人口最多的国家之一，人口超过14亿。中国拥有悠久的历史和文明，其政治、经济和文化中心包括首都北京以及上海等大城市。</p>
<div class="imgph">[Image: 中国地图与长城]</div><section><h2>历史</h2><p>中国历史源远流长，经历了多个朝代的更替，1912年建立中华民国，1949年中华人民共和国成立。</p></section><section><h2>地理与文化</h2><p>中国地势西高东低，拥有长江、黄河等大河，以及多样化的自然景观和丰富的文化遗产，如长城和故宫。</p></section></main>
