<br><b>Neokonkretismus</b> (portugiesisch Neoconcretismo)<br>Zeitraum: 1959 bis ca. 1965<br>Ort: Rio de Janeiro, Brasilien</div>
<p><b>Neokonkretismus</b> (portugiesisch <i>Neoconcretismo</i>) bezeichnet die Kunstauffassung der brasilianischen Neokonkreten Bewegung, die 1959 mit dem von Ferreira Gullar verfassten „Neokonkreten Manifest“ in Rio de Janeiro proklamiert wurde. Der Neokonkretismus verstand sich als kritische Weiterentwicklung der Konkreten Kunst.</p>
<h2>Grundgedanken</h2>
<p>Während die konkrete Kunst – besonders in der orthodoxen Ausprägung der São-Paulo-Gruppe Ruptura um Waldemar Cordeiro – das Kunstwerk als rational konstruiertes, mathematisch begründbares Objekt verstand, betonte der Neokonkretismus die phänomenologische Erfahrung: Das Werk existiert nicht als autonomes Objekt, sondern ereignet sich in der Begegnung mit dem Betrachter, der es berührt, bewegt und vervollständigt. Gullar formulierte dies in seiner „Theorie des Nicht-Objekts“ (1959).</p>
<h2>Werke und Vertreter</h2>
<p>Die Arbeiten von Lygia Clark (die faltbaren Metallplastiken der „Bichos“-Serie), Hélio Oiticica (Farbräume, „Penetráveis“, „Parangolés“) und Lygia Pape (das „Ballet Neoconcreto“ und die Holzschnitte der „Tecelares“) veranschaulichen den Übergang vom Bild zur Aktion und zur raum-zeitlichen Erfahrung. Weitere Vertreter waren Amilcar de Castro, Franz Weissmann und Willys de Castro.</p>
<h2>Abgrenzung</h2>
<p>Der Neokonkretismus wird von der übergeordneten Neokonkreten Bewegung als Gruppenphänomen unterschieden: Er bezeichnet das ästhetische Programm, während die Bewegung auch ihr soziales und institutionelles Umfeld – Ausstellungen, Zeitschriften wie das <i>Jornal do Brasil</i>-Feuilleton und die Auseinandersetzung mit dem Konkretismus São Paulos – umfasst.</p>
