<br><b>Neuaramäisch</b><br>Sprachfamilie: Afroasiatisch → Semitisch → Aramäisch<br>Verbreitung: Nordirak, Südosttürkei, Nordostsyrien, Nordwestiran, Diaspora</div>
<p>Die <b>neuaramäischen Sprachen</b> sind die heute noch gesprochenen Varietäten des Aramäischen, einer semitischen Sprache mit rund 3.000-jähriger Geschichte. Sie werden vor allem von christlichen Assyrern/Aramäern/Chaldäern sowie von jüdischen und mandäischen Gemeinschaften in der historischen Region Mesopotamien und in der weltweiten Diaspora gesprochen.</p>
<h2>Gliederung</h2>
<p>Man unterscheidet üblicherweise vier Gruppen:</p>
<ul>
<li><b>Westliches Neuaramäisch</b>, gesprochen in drei Dörfern des Antilibanon in Syrien, darunter Maalula</li>
<li><b>Zentrales Neuaramäisch</b>, darunter Turoyo im Tur Abdin (Südosttürkei)</li>
<li><b>Nordöstliches Neuaramäisch (NENA)</b>, eine große, stark zersplitterte Dialektgruppe im Nordirak, der Südosttürkei, Nordwestsyrien und im Nordwestiran, zu der das moderne Assyrische (Sureth) und das Chaldäische gehören</li>
<li><b>Neumandäisch</b>, die gesprochene Sprache der Mandäer im Südirak und in Chuzestan (Iran)</li>
</ul>
<h2>Gefährdung</h2>
<p>Nahezu alle neuaramäischen Sprachen gelten als gefährdet oder stark gefährdet. Gründe sind Verfolgung und Vertreibung der Sprechergemeinschaften – darunter der Völkermord an den Assyrern (Sayfo) 1915, die Al-Anfal-Kampagne im Irak und der Terror des „Islamischen Staats“ ab 2014 – sowie die Auswanderung in die Diaspora, wo die Sprachen zunehmend vom Übergang zu den Mehrheitssprachen bedroht sind. Die Sprecherzahlen werden auf einige hunderttausend Menschen geschätzt.</p>
<h2>Schrift</h2>
<p>Geschrieben werden die neuaramäischen Sprachen überwiegend mit der syrischen Schrift (in den Varianten Estrangelo, Serto und Madnchaja). Die schriftsprachlichen Standards des Assyrischen beruhen auf dem Dialekt von Urmia (Iran).</p>
