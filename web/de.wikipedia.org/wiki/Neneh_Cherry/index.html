<br><b>Neneh Mariann Cherry</b><br>geboren 10. März 1964 in Stockholm<br>Sängerin, Rapperin, Songwriterin</div>
<p><b>Neneh Mariann Cherry</b> (* 10. März 1964 in Stockholm) ist eine schwedische Sängerin, Rapperin und Songwriterin. Weltweit bekannt wurde sie 1988 mit dem Hit <i>Buffalo Stance</i> und dem Album <i>Raw Like Sushi</i>, das Hip-Hop, Dance und Pop miteinander verband.</p>
<h2>Leben</h2>
<p>Neneh Cherry ist die Tochter der schwedischen Künstlerin Moki Karlsson und des aus Sierra Leone stammenden Musikers Ahmadu Jah. Nach dem Tod ihres Vaters heiratete ihre Mutter den amerikanischen Jazztrompeter Don Cherry, der Neneh adoptierte und ihr seinen Nachnamen gab. Die Familie lebte zeitweise in Schweden und in den USA; zu ihren Stiefgeschwistern zählen der Musiker Eagle-Eye Cherry und die Sängerin Titiyo. Ihre Tochter ist die Sängerin Mabel.</p>
<h2>Karriere</h2>
<p>Cherry zog als Jugendliche nach London und wurde Teil der dortigen Post-Punk- und New-Wave-Szene. Sie sang unter anderem bei The Slits, New Age Steppers und der Band Rip Rig + Panic, später bei Float Up CP. 1988 gelang ihr mit <i>Buffalo Stance</i> der internationale Durchbruch. Es folgten die Alben <i>Homebrew</i> (1992) und <i>Man</i> (1996), aus dem das in zahlreichen Ländern erfolgreiche Duett <i>7 Seconds</i> mit Youssou N'Dour stammt.</p>
<p>Nach längerer Pause veröffentlichte sie 2012 mit der Free-Jazz-Formation The Thing das Album <i>The Cherry Thing</i>. 2014 erschien ihr von Four Tet produziertes Soloalbum <i>Blank Project</i>, 2018 das von Four Tet und Massive Attacks 3D mitproduzierte Album <i>Broken Politics</i> und 2022 <i>The Versions</i>, ein Album mit Neuinterpretationen ihrer Songs durch andere Künstlerinnen.</p>
