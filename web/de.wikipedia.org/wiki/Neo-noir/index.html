<br><b>Neo-Noir</b><br>Filmstil, ab ca. 1970<br>Vorbild: Film noir (1940er/50er Jahre)<br>Beispiele: Chinatown, Blade Runner, Pulp Fiction, L.A. Confidential</div>
<p>Als <b>Neo-Noir</b> bezeichnet man Filme, die die Themen, Erzählmuster und Bildsprache des klassischen Film noir der 1940er und 1950er Jahre ab etwa 1970 aufgreifen und in zeitgenössischem Stil aktualisieren. Neo-Noir ist – wie sein Vorbild – weniger ein Genre als ein übergreifender Stil, der in Thrillern, Kriminalfilmen, Science-Fiction und Dramen auftreten kann.</p>
<h2>Merkmale</h2>
<p>Wiederkehrende Elemente sind moralisch zwielichtige, oft zynische oder gebrochene Hauptfiguren, die Femme fatale, Erzählungen aus der Rückblende mit Voice-over, eine düstere, von Hell-Dunkel-Kontrasten, Nacht- und Regenszenen geprägte Bildgestaltung sowie Handlungsorte in der anonymen Großstadt. Anders als der klassische Film noir arbeitet der Neo-Noir mit Farbe, expliziterer Darstellung von Gewalt und Sexualität und häufig mit selbstreflexiven, das Vorbild kommentierenden Erzählformen.</p>
<h2>Geschichte</h2>
<p>Als frühes Schlüsselwerk gilt Roman Polańskis <i>Chinatown</i> (1974), der den Noir-Stoff bewusst in die klassische Periode zurückverlegte. Ridley Scotts <i>Blade Runner</i> (1982) übertrug den Stil in die Science-Fiction und prägte den Begriff „Tech-Noir“. Weitere bedeutende Beispiele sind <i>Taxi Driver</i> (1976), <i>Body Heat</i> (1981), <i>Blue Velvet</i> (1986), <i>Pulp Fiction</i> (1994), <i>Sieben</i> (1995), <i>L.A. Confidential</i> (1997), <i>Memento</i> (2000) und <i>Drive</i> (2011). Auch Serien, Computerspiele und Comics greifen Neo-Noir-Ästhetik auf.</p>
