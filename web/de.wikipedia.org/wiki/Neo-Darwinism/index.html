<br><b>Neodarwinismus</b><br>Begriffsprägung: George Romanes (1895)<br>Zentrale Figur: August Weismann</div>
<p>Der <b>Neodarwinismus</b> ist eine Weiterentwicklung der Evolutionstheorie Charles Darwins, die in den 1890er Jahren vor allem mit August Weismann verbunden ist. Er lehnt die Vererbung erworbener Eigenschaften (Lamarckismus) ab und erklärt die Evolution allein durch Variation und natürliche Selektion auf der Ebene erblicher Anlagen.</p>
<h2>Geschichte</h2>
<p>Der Begriff wurde 1895 von George John Romanes geprägt für die Auffassung, dass natürliche Auslese der einzige wesentliche Mechanismus der Evolution sei. Weismann hatte mit seiner Keimplasmatheorie (1892) postuliert, dass die Erbmasse (Keimplasma) von den Körperzellen (Soma) getrennt sei und Veränderungen des Körpers daher nicht vererbt werden könnten; sein oft zitiertes Experiment, Mäusen über Generationen die Schwänze abzuschneiden, ohne dass die Nachkommen schwanzlos geboren wurden, sollte die Nichtvererbbarkeit erworbener Merkmale belegen.</p>
<h2>Verhältnis zur Modernen Synthese</h2>
<p>Der Neodarwinismus im historischen Sinn wird oft von der „Modernen Synthese“ der 1930er und 1940er Jahre unterschieden, die Darwins Selektionstheorie mit der Mendelschen Genetik und der Populationsgenetik (Fisher, Haldane, Wright, Dobzhansky, Mayr) verband. Im weiteren Sprachgebrauch – insbesondere in populärwissenschaftlichen und philosophischen Kontexten – wird „Neodarwinismus“ heute häufig synonym für diese moderne synthetische Evolutionstheorie verwendet.</p>
