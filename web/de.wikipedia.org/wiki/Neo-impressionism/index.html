<br><b>Neo-impressionism</b> ist die im Englischen übliche Schreibweise für den Neoimpressionismus, die von Georges Seurat und Paul Signac begründete Malweise des Divisionismus.</div>
<p><b>Neo-impressionism</b> (mit kleinem „i“ nach dem Bindestrich) ist die in englischsprachigen Ausgaben und in der englischen Wikipedia gebräuchliche Schreibweise des Begriffs, der auf Deutsch <b>Neoimpressionismus</b> lautet. Die Schreibweise folgt der englischen Orthografie von Kunststil-Eigennamen aus dem Französischen, in dem die Richtung als <i>néo-impressionnisme</i> bezeichnet wird.</p>
<h2>Zum Begriff</h2>
<p>Der Kunstkritiker Félix Fénéon prägte den Begriff 1886, um die Malerei Georges Seurats und Paul Signacs von der des älteren Impressionismus abzugrenzen. Charakteristisch sind die divisionistische Technik – das Nebeneinandersetzen ungemischter Farbtupfer, die sich im Auge des Betrachters optisch mischen –, die Orientierung an farbwissenschaftlichen Theorien Chevreuls und Roods und ein programmatischer Anspruch, den Signac 1899 in seiner Schrift <i>D'Eugène Delacroix au Néo-Impressionnisme</i> darlegte.</p>
<p>Im deutschsprachigen Raum setzte sich die zusammengezogene Form ohne Bindestrich und mit großem „I“ durch (Neoimpressionismus), während in internationalem Austausch und in Eigennamen der englischen Fachliteratur meist die Form „Neo-impressionism“ erscheint.</p>
