<br><b>Neokonfuzianismus</b> (chinesisch 理學 / 心學; kor. Seongnihak; jap. Shushigaku)<br>Entstehung: Song-Dynastie (11./12. Jahrhundert)<br>Hauptvertreter: Zhu Xi, Wang Yangming</div>
<p>Der <b>Neokonfuzianismus</b> ist eine Erneuerungsbewegung des Konfuzianismus, die in der chinesischen Song-Dynastie (960–1279) entstand und die konfuzianische Lehre unter Aufnahme von Fragestellungen des Buddhismus und Daoismus zu einem umfassenden metaphysischen und ethischen System ausbaute. Er wurde zur Staatsorthodoxie Chinas und prägte auch Korea, Japan und Vietnam nachhaltig.</p>
<h2>Geschichte</h2>
<p>Vorbereitet durch Denker der Tang-Zeit wie Han Yu, entfaltete sich der Neokonfuzianismus im 11. Jahrhundert mit Zhou Dunyi, Zhang Zai und den Brüdern Cheng Hao und Cheng Yi. Zhu Xi (1130–1200) fasste die Lehren in einer großen Synthese zusammen und legte mit seinen Kommentaren zu den „Vier Büchern“ (Großes Lernen, Mitte und Maß, Gespräche des Konfuzius, Menzius) den Kanon fest, der bis 1905 Grundlage der chinesischen Beamtenprüfungen blieb.</p>
<p>Die Cheng-Zhu-Schule wird als „Schule des Prinzips“ (理學, Lixue) bezeichnet, da sie das universale Prinzip <i>li</i> (理) ins Zentrum stellt, das sich in der Stoffkraft <i>qi</i> (氣) verwirklicht. Demgegenüber betonte Wang Yangming (1472–1529), Hauptvertreter der „Schule des Herzens/Geistes“ (心學, Xinxue), die angeborene intuitive Erkenntnis des Guten (liangzhi) und die Einheit von Wissen und Handeln.</p>
<h2>Lehre</h2>
<p>Ziel neokonfuzianischer Praxis ist die Selbstkultivierung des Menschen zur moralischen Vollkommenheit („Weiser“, shengren) durch Studium der Klassiker, „Erforschung der Dinge“ (gewu) und stille Meditation. Kosmologie, Ethik und Staatslehre bilden eine Einheit: Die geordnete Familie und der geordnete Staat spiegeln die Ordnung des Kosmos.</p>
<h2>Verbreitung</h2>
<p>In Korea wurde der Neokonfuzianismus (Seongnihak) unter der Joseon-Dynastie zur herrschenden Ideologie; Denker wie Yi Hwang und Yi I führten die Debatten um li und qi fort. In Japan wurde die Zhu-Xi-Schule (Shushigaku) in der Edo-Zeit vom Tokugawa-Shogunat gefördert. Im 20. Jahrhundert knüpfte der „Neue Konfuzianismus“ (Moderne Neokonfuzianer wie Mou Zongsan) an diese Tradition an.</p>
