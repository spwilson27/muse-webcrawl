<br><b>Neo-Riemannsche Theorie</b> (engl. Neo-Riemannian theory)<br>Entstehung: USA, ab den 1980er Jahren<br>Grundlagen: Hugo Riemanns Funktionstheorie; Grundtransformationen P, L, R</div>
<p>Die <b>Neo-Riemannsche Theorie</b> ist ein Ansatz der Musiktheorie, der harmonische Fortschreitungen in tonalen und spätromantisch-chromatischen Werken durch eine kleine Zahl elementarer Klangverwandlungen zwischen Dreiklängen beschreibt. Sie knüpft an Begriffe des deutschen Musiktheoretikers Hugo Riemann (1849–1919) an, wurde aber in den 1980er und 1990er Jahren vor allem in den USA (David Lewin, Brian Hyer, Richard Cohn) neu formuliert.</p>
<h2>Die Grundtransformationen</h2>
<p>Ausgangspunkt sind drei Spiegelungsoperationen auf Dur- und Molldreiklängen, bei denen jeweils zwei Töne gleich bleiben und ein Ton um einen Halb- oder Ganztonschritt wechselt (sparsame Stimmführung):</p>
<ul>
<li><b>P</b> (Parallelverwandlung): verbindet einen Dreiklang mit seiner Tongeschlechtsparallele, z. B. C-Dur ↔ c-Moll.</li>
<li><b>L</b> (Leittonwechsel): verbindet einen Dreiklang mit seinem Leittonwechselklang, z. B. C-Dur ↔ e-Moll.</li>
<li><b>R</b> (Relative Verwandlung): verbindet einen Dreiklang mit seiner Terzparallele im anderen Tongeschlecht, z. B. C-Dur ↔ a-Moll.</li>
</ul>
<p>Kombinationen dieser Operationen erzeugen weitere Verwandlungen (etwa PL, RP oder die „Dominant“- und „Hexatonik“-Systeme). Die 24 Dur- und Molldreiklänge lassen sich als Netzwerk – in Anlehnung an Riemanns und schon Eulers <i>Tonnetz</i> – anordnen, in dem benachbarte Klänge durch eine einzige Grundtransformation verbunden sind.</p>
<h2>Anwendungsbereich</h2>
<p>Die Theorie eignet sich besonders zur Analyse chromatischer Musik des 19. Jahrhunderts (Schubert, Liszt, Wagner, Brahms), deren Akkordverbindungen sich der klassischen Funktionstheorie entziehen, sowie für Filmmusik, in der mediantische Klangfolgen häufig vorkommen.</p>
