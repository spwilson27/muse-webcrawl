<br><b>Neoexpressionismus</b><br>Zeitraum: ca. 1978–Mitte der 1980er Jahre<br>Regionen: Deutschland, Italien, USA<br>Deutsche Vertreter: Georg Baselitz, Anselm Kiefer, Jörg Immendorff, Markus Lüpertz</div>
<p>Der <b>Neoexpressionismus</b> ist eine internationale Strömung der Malerei, die Ende der 1970er Jahre als Gegenbewegung zu Minimal Art und Konzeptkunst eine kraftvolle, figurative und subjektiv-expressiv gestische Bildsprache propagierte. In Deutschland wird sie mit den „Neuen Wilden“ bzw. der „Jungen Wilden“ gleichgesetzt, in Italien mit der Transavantgarde und in den USA mit der New Image Painting.</p>
<h2>Merkmale</h2>
<p>Charakteristisch sind großformatige, mit schnellem, pastosem Farbauftrag gemalte Bilder mit erkennbaren Figuren, mythologischen und historischen Motiven und einer bewussten Rückbesinnung auf die Bildtraditionen vor allem des Expressionismus. Deutsche Künstler wie Anselm Kiefer und Jörg Immendorff verarbeiteten zudem die deutsche Geschichte und nationale Mythen, Georg Baselitz stellte seine Motive seit 1969 „auf den Kopf“.</p>
<h2>Geschichte</h2>
<p>Die Ausstellung „A New Spirit in Painting“ (London 1981) und die documenta 7 (1982) machten die Strömung international bekannt; die Ausstellung „Zeitgeist“ in Berlin (1982) wurde zu ihrem programmatischen Ereignis. Der italienische Kritiker Achille Bonito Oliva prägte für die italienische Variante den Begriff Transavanguardia (Sandro Chia, Francesco Clemente, Enzo Cucchi, Mimmo Paladino). In den USA gehörten Julian Schnabel und David Salle zu den prominenten Vertretern.</p>
<p>Mitte der 1980er Jahre geriet der Neoexpressionismus wegen seines raschen Markterfolgs und einer als oberflächlich empfundenen „Malerei um jeden Preis“ in die Kritik, blieb aber ein prägender Faktor der Malerei des Jahrzehnts.</p>
