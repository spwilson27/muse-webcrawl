<br><b>Neoluddismus</b><br>Bezug: Ludditen (England, 1811–1816)<br>Themen: Technikkritik, Digitalisierung, industrielle Landwirtschaft</div>
<p>Der <b>Neoluddismus</b> ist eine philosophische und aktivistische Strömung, die moderne Technologie kritisch sieht und sich für eine Begrenzung oder Ablehnung bestimmter Technologien ausspricht. Der Name bezieht sich auf die englischen Ludditen des frühen 19. Jahrhunderts, Textilarbeiter, die Maschinen zerstörten, weil diese ihre Existenzgrundlage bedrohten.</p>
<h2>Inhalte</h2>
<p>Neoludditen sind keine einheitliche Bewegung und wenden sich nicht gegen Technik schlechthin, sondern gegen Technologien, die sie als schädlich für Mensch, Gesellschaft oder Umwelt beurteilen – etwa Überwachungstechnik, bestimmte Formen der Automatisierung, industrielle Landwirtschaft oder digitale Kommunikationstechnologien, denen sie Entfremdung, Gesundheitsrisiken und die Erosion von Gemeinschaft vorwerfen. Sie kritisieren den Glauben an den technologischen Fortschritt als Selbstzweck (Technologieoptimismus) und fordern, Technologie nach ihren Folgen für ein gutes Leben zu bewerten.</p>
<h2>Bekannte Positionen</h2>
<p>Als intellektuelle Bezugspunkte gelten unter anderen der Historiker Lewis Mumford, der Philosoph Jacques Ellul (<i>Das technologische System</i>) und der Autor Kirkpatrick Sale, der 1995 auf einer Veranstaltung öffentlich einen Computer zertrümmerte. Der amerikanische Autor Chellis Glendinning verfasste 1990 ein „Neo-Luddite Manifesto“. Auch die Schriften Theodore Kaczynskis wurden im Zusammenhang mit Neoluddismus diskutiert, wobei sich die meisten Technikkritiker von dessen Gewalt ausdrücklich distanzieren.</p>
<p>In jüngerer Zeit werden Kritik an sozialen Medien, Smartphone-Nutzung („digital detox“) und Forderungen nach einem Recht auf analoge Alternativen gelegentlich dem Neoluddismus zugeordnet.</p>
