<br><b>Neoimpressionismus</b><br>Zeitraum: ca. 1884–1910<br>Begründer: Georges Seurat, Paul Signac<br>Technik: Pointillismus / Divisionismus</div>
<p>Der <b>Neoimpressionismus</b> ist eine Stilrichtung der Malerei, die in den 1880er Jahren in Frankreich aus dem Impressionismus hervorging. Ihr Kennzeichen ist eine systematische, an farbtheoretischen Erkenntnissen orientierte Malweise: Reine Farben werden in kleinen Punkten oder Strichen nebeneinandergesetzt und mischen sich erst im Auge des Betrachters (optische Mischung).</p>
<h2>Geschichte</h2>
<p>Der Begriff wurde 1886 vom Kritiker Félix Fénéon geprägt, anlässlich der letzten Impressionistenausstellung, auf der Georges Seurat sein monumentales Gemälde <i>Ein Sonntagnachmittag auf der Insel La Grande Jatte</i> (1884–1886) zeigte. Seurat und Paul Signac stützten sich auf die Farbtheorien von Michel Eugène Chevreul (Simultankontrast) und Ogden Rood. Signac fasste das Programm 1899 in der Schrift <i>D'Eugène Delacroix au Néo-Impressionnisme</i> zusammen.</p>
<h2>Technik</h2>
<p>Die neoimpressionistische Malweise wird auch als <b>Pointillismus</b> (punktförmiger Auftrag) oder <b>Divisionismus</b> bzw. Chromoluminarismus (Farbteilung) bezeichnet. Auf das Mischen der Farben auf der Palette wird weitgehend verzichtet; ungemischte Töne werden in regelmäßigen Tupfen nebeneinander gesetzt, was Leuchtkraft und Farbintensität steigern soll.</p>
<h2>Künstler</h2>
<p>Neben Seurat und Signac zählen Camille Pissarro (zeitweise), Henri-Edmond Cross, Maximilien Luce, Théo van Rysselberghe und Anna Boch zu den Vertretern. Viele Neoimpressionisten standen anarchistischen Ideen nahe und verbanden ihre Ästhetik mit gesellschaftlichen Idealen. Der Neoimpressionismus beeinflusste Fauvismus und die frühe Moderne erheblich.</p>
