<br><b>Neubabylonisches Reich</b><br>Bestand: 626–539 v. Chr.<br>Hauptstadt: Babylon<br>Dynastie: Chaldäische Dynastie</div>
<p>Das <b>Neubabylonische Reich</b> (auch <i>Chaldäisches Reich</i>) war ein Reich im Alten Orient, das von 626 bis 539 v. Chr. bestand. Es trat die Nachfolge des Neuassyrischen Reiches in Mesopotamien an und erlebte unter Nebukadnezar II. seine größte Blüte, bevor es von den Persern unter Kyros II. erobert wurde.</p>
<h2>Geschichte</h2>
<p>626 v. Chr. setzte sich der chaldäische Stammesführer Nabupolassar in Babylon gegen die assyrische Oberherrschaft durch. Im Bündnis mit den Medern zerstörte er 612 v. Chr. Ninive und vernichtete bis 609 v. Chr. die Reste des assyrischen Reiches. In der Schlacht bei Karkemiš 605 v. Chr. besiegte sein Sohn Nebukadnezar die Ägypter und sicherte Babylon die Herrschaft über Syrien und die Levante.</p>
<p>Nebukadnezar II. (605–562 v. Chr.) eroberte zweimal Jerusalem (597 und 587 v. Chr.), zerstörte den Tempel und deportierte Teile der judäischen Bevölkerung ins Babylonische Exil. Er ließ Babylon prächtig ausbauen: Das Ischtar-Tor, die Prozessionsstraße, der Stufenturm Etemenanki und die Palastanlagen stammen aus seiner Zeit; die biblische Tradition verbindet ihn auch mit den „Hängenden Gärten“.</p>
<p>Nach mehreren kurz regierenden Nachfolgern kam 556 v. Chr. Nabonid auf den Thron, der sich zeitweise in der Oase Tayma in Arabien aufhielt und den Mondgott Sin förderte, was ihn in Konflikt mit der Priesterschaft des Marduk brachte. 539 v. Chr. zog der Perserkönig Kyros II. kampflos in Babylon ein und beendete das Reich.</p>
<h2>Kultur und Wissenschaft</h2>
<p>Die neubabylonische Zeit war eine Blütezeit von Astronomie und Mathematik: Babylonische Astronomen führten systematische Himmelsbeobachtungen (astronomische Tagebücher) und entwickelten das Sexagesimalsystem weiter. In der Verwaltungssprache setzte sich zunehmend das Aramäische durch, während das Akkadische in Keilschrift für Recht, Kult und Wissenschaft weiterverwendet wurde.</p>
