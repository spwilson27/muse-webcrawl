<br><b>Neo-Konzeptkunst</b> (engl. Neo-conceptual art)<br>Zeitraum: ab Ende der 1970er Jahre<br> Zentren: New York, London, Köln</div>
<p>Die <b>Neo-Konzeptkunst</b> ist eine Strömung der zeitgenössischen Kunst, die ab dem späten 20. Jahrhundert an die Konzeptkunst der 1960er und 1970er Jahre anknüpft, deren Ideen aber unter veränderten Bedingungen – insbesondere im Hinblick auf die Warenform der Kunst und die Medien- und Konsumkultur – weiterentwickelt.</p>
<h2>Merkmale</h2>
<p>Wie die klassische Konzeptkunst stellt die Neo-Konzeptkunst die Idee über die materielle Ausführung; zugleich reflektiert sie die eigene Verstrickung in Markt, Institutionen und Bildproduktion. Häufige Verfahren sind Appropriation (Aneignung vorgefundener Bilder und Objekte), serielles Arbeiten, Text- und Sprachelemente sowie die Untersuchung von Autorschaft, Originalität und Repräsentation.</p>
<h2>Vertreter und Kontext</h2>
<p>Zum Umfeld werden die Künstler der New Yorker „Pictures Generation“ wie Sherrie Levine, Richard Prince und Barbara Kruger gezählt, ebenso Jeff Koons – dessen industriell gefertigte Objekte den Warencharakter von Kunst thematisieren –, Haim Steinbach mit seinen Regalskulpturen, der Kölner Martin Kippenberger sowie die britischen Young British Artists wie Damien Hirst, dessen Arbeiten Konzept, Werkstattproduktion und Kunstmarkt pointiert verbinden. Auch die Arbeiten von Jenny Holzer und Barbara Kruger mit Textbotschaften im öffentlichen Raum werden der Richtung zugeordnet.</p>
<h2>Abgrenzung</h2>
<p>Der Begriff ist umstritten und wird oft locker für jede konzeptuell orientierte Kunst nach 1980 verwendet. Kritiker wenden ein, dass die Neo-Konzeptkunst die radikale Institutions- und Marktkritik ihrer Vorgänger vielfach aufgegeben und sich selbst erfolgreich im Markt etabliert habe.</p>
