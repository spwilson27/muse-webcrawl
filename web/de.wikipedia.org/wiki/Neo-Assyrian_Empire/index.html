<br><b>Neuassyrisches Reich</b><br>Bestand: ca. 911–609 v. Chr.<br>Hauptstädte: Aššur, Kalchu (Nimrud), Dur-Šarrukin, Ninive<br>Sprache: Akkadisch (Assyrischer Dialekt), zunehmend Aramäisch</div>
<p>Das <b>Neuassyrische Reich</b> war ein Reich im Alten Orient, das von etwa 911 v. Chr. bis zu seinem Untergang 609 v. Chr. bestand. Ausgehend vom assyrischen Kernland am oberen Tigris im heutigen Nordirak wuchs es zum ersten Großreich der Geschichte heran, das den gesamten Fruchtbaren Halbmond – von Ägypten bis zum Persischen Golf und nach Anatolien – beherrschte.</p>
<h2>Geschichte</h2>
<p>Nach dem Zusammenbruch des Mittelassyrischen Reiches in der Spätbronzezeit-Krise begann unter Adad-nirari II. (911–891 v. Chr.) die Rückeroberung der verlorenen Gebiete. Aššur-naṣir-apli II. (883–859) verlegte die Hauptstadt nach Kalchu (Nimrud) und sicherte die Grenzen durch brutale Feldzüge. Unter Tiglat-Pileser III. (745–727) wurde das Reich durchgreifend reformiert: Eroberte Gebiete wurden in Provinzen unter königlichen Beamten umgewandelt, Massen­deportationen dienten der Kontrolle unterworfener Völker.</p>
<p>Sargon II. (721–705) gründete die Sargoniden-Dynastie und die neue Hauptstadt Dur-Šarrukin. Sein Sohn Sanherib (705–681) zerstörte Babylon und verlegte die Residenz nach Ninive. Unter Asarhaddon (681–669) wurde 671 v. Chr. Ägypten erobert; Aššur-bāni-apli (668–627) fügte Elam hinzu und gründete die berühmte Bibliothek von Ninive. Das Reich erreichte seine größte Ausdehnung.</p>
<h2>Untergang</h2>
<p>Nach dem Tod Aššur-bāni-aplis führten Thronwirren, Überdehnung und aufständische Vasallen zum raschen Zusammenbruch. Ein Bündnis aus Neubabyloniern unter Nabupolassar und Medern unter Kyaxares eroberte 612 v. Chr. Ninive; 609 v. Chr. fiel mit Harran der letzte assyrische Stützpunkt.</p>
<h2>Verwaltung und Kultur</h2>
<p>Das Reich war in Provinzen gegliedert, die von Gouverneuren verwaltet wurden; ein Nachrichtenwesen mit Relaisstationen verband die Zentrale mit den Randgebieten. Amtssprache war das akkadische Assyrische in Keilschrift, daneben verbreitete sich das alphabetische Aramäisch als Verkehrssprache. Berühmt sind die großformatigen Orthostatenreliefs der Paläste, die Feldzüge und Jagden der Könige darstellen.</p>
