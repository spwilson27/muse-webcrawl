<br><b>Neodruidismus</b> (auch modernes Druidentum)<br>Entstehung: Britannien, 18. Jahrhundert; religiöse Ausformung ab 20. Jahrhundert<br>Feiertage: acht Jahreskreisfeste (u. a. Samhain, Beltane, Sonnenwenden)</div>
<p>Der <b>Neodruidismus</b> ist eine moderne spirituelle und religiöse Bewegung, die sich an den Druiden – den Priester-, Gelehrten- und Richterkasten der antiken Kelten – orientiert. Er zählt zum modernen Heidentum (Neopaganismus) und betont Naturverehrung, die Verehrung von Ahnen und Gottheiten sowie die Feier der Jahreskreisfeste.</p>
<h2>Geschichte</h2>
<p>Die Anfänge liegen im britischen Druidenrevival des 18. Jahrhunderts: 1717 soll in London der Ancient Order of Druids (später Ancient Druid Order) gegründet worden sein; William Stukeley deutete Stonehenge irrtümlich als Druidentempel. Der Waliser Edward Williams (Iolo Morganwg) verband das Druidentum mit walisischer Kultur und dem Eisteddfod. Diese frühen Orden waren überwiegend kulturelle und freundschaftliche Vereinigungen, keine Rekonstruktionen antiker Religion.</p>
<p>Im 20. Jahrhundert bildeten sich religiös ausgerichtete Gruppen heraus, darunter der 1964 von Ross Nichols gegründete Order of Bards, Ovates and Druids (OBOD), heute eine der größten druidischen Organisationen weltweit, sowie die Ár nDraíocht Féin (ADF) in den USA. In Großbritannien wurde das Druidentum 2010 von der Charity Commission als Religion anerkannt.</p>
<h2>Praxis und Glaubensinhalte</h2>
<p>Neodruiden feiern typischerweise acht Jahresfeste (die vier keltischen Feuerfeste Samhain, Imbolc, Beltane und Lughnasadh sowie die Sonnenwenden und Tagundnachtgleichen), häufig im Freien an Steinkreisen oder in Hainen. Zentrale Konzepte sind Awen (göttliche Inspiration), die Verehrung der Natur als heilig und – je nach Strömung – polytheistische Gottheiten der keltischen Überlieferung. Da von den antiken Druiden keine eigenen Schriften überliefert sind, verstehen sich moderne Druiden überwiegend nicht als exakte Rekonstruktion, sondern als zeitgenössische Spiritualität in keltisch inspirierter Form.</p>
