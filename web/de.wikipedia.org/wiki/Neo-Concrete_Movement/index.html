<br><b>Neokonkrete Bewegung</b> (portugiesisch Movimento Neoconcreto)<br>Begründet: 1959 in Rio de Janeiro<br>Schlüsselfiguren: Lygia Clark, Hélio Oiticica, Lygia Pape, Ferreira Gullar</div>
<p>Die <b>Neokonkrete Bewegung</b> (portugiesisch <i>Movimento Neoconcreto</i>) war eine brasilianische Künstlerbewegung, die sich 1959 in Rio de Janeiro vom rationalistischen Konkretismus der São-Paulo-Gruppe Ruptura abspaltete. Sie verband geometrische Abstraktion mit sinnlicher Erfahrung, Körperlichkeit und der Beteiligung des Betrachters.</p>
<h2>Geschichte</h2>
<p>Ausgangspunkt war die „I. Ausstellung Neokonkreter Kunst“ im März 1959 im Museu de Arte Moderna in Rio de Janeiro, auf der Ferreira Gullar sein „Neokonkretes Manifest“ veröffentlichte. Das Manifest wandte sich gegen den „mechanistischen“ Rationalismus der konkreten Kunst und forderte, das Kunstwerk als lebendigen Organismus – als „Nicht-Objekt“ (não-objeto) – zu verstehen, das sich erst in der Wahrnehmung und Teilnahme des Betrachters verwirklicht.</p>
<p>Zu den Mitgliedern zählten Lygia Clark, Hélio Oiticica, Lygia Pape, Amilcar de Castro, Franz Weissmann, Reynaldo Jardim und Theon Spanudis. Clark entwickelte aus ihren aufklappbaren „Bichos“ (Tiere) heraus partizipative Objekte; Oiticica schuf mit den „Parangolés“ tragbare Farbkörper für den tanzenden Körper und mit „Tropicália“ (1967) begehbar-installative Umgebungen. In den frühen 1960er Jahren zerfiel die Gruppe angesichts der politischen Radikalisierung und des Militärputsches von 1964 in Brasilien.</p>
<h2>Bedeutung</h2>
<p>Die neokonkrete Bewegung gilt als eine der einflussreichsten lateinamerikanischen Avantgarden. Ihre Ideen von Partizipation, Körper und prozesshaftem Werk wirkten auf die internationale Konzept- und Installationskunst und werden seit den 2000er Jahren in großen Retrospektiven weltweit rezipiert.</p>
