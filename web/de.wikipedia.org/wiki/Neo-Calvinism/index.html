<br><b>Neocalvinismus</b><br>Entstehung: Niederlande, Ende 19. Jahrhundert<br>Zentrale Personen: Abraham Kuyper, Herman Bavinck</div>
<p>Der <b>Neocalvinismus</b> ist eine niederländische Bewegung innerhalb des reformierten Protestantismus, die im späten 19. Jahrhundert entstand und den Calvinismus als umfassende Welt- und Lebensanschauung für alle Bereiche der modernen Gesellschaft neu zur Geltung bringen wollte. Ihre zentralen Gestalten waren der Theologe und Politiker Abraham Kuyper (1837–1920) und der Dogmatiker Herman Bavinck (1854–1921).</p>
<h2>Zentrale Ideen</h2>
<p>Kernbegriffe des Neocalvinismus sind die <i>Souveränität in eigenem Kreise</i> („soevereiniteit in eigen kring“), wonach jeder Lebensbereich – Familie, Kirche, Staat, Wissenschaft, Kunst, Wirtschaft – unmittelbar unter Gottes Herrschaft steht und keiner einem anderen untergeordnet ist, sowie die Lehre von der <i>allgemeinen Gnade</i> (gemeene gratie), durch die Gott die Welt erhält und auch außerhalb der Kirche Gutes wirkt. Dem steht die <i>Antithese</i> gegenüber: die geistliche Grundentscheidung zwischen Glauben und Unglauben, die sich durch alle Lebensbereiche ziehe.</p>
<h2>Geschichte und Wirkung</h2>
<p>Kuyper gründete 1879 die Antirevolutionäre Partei, 1880 die Freie Universität Amsterdam und war an der Kirchenabspaltung der Doleantie (1886) beteiligt, die 1892 zu den Gereformeerde Kerken in Nederland führte. Von 1901 bis 1905 war er Ministerpräsident der Niederlande. Die neocalvinistische Gesellschaftsvision prägte maßgeblich die niederländische Verzuiling („Versäulung“), das Nebeneinander weltanschaulich organisierter gesellschaftlicher Säulen mit eigenen Schulen, Universitäten, Zeitungen und Parteien.</p>
<p>International wirkte der Neocalvinismus unter anderem über die reformierten Kirchen Nordamerikas und die Philosophie Herman Dooyeweerds und Dirk Vollenhovens weiter; in jüngerer Zeit erfuhr er im englischsprachigen Raum durch Kuyper-Übersetzungen neue Aufmerksamkeit.</p>
