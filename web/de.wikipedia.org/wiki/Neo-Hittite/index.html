<br><b>Späthethitische Fürstentümer</b> (auch syro-hethitische Staaten)<br>Bestand: ca. 1175–700 v. Chr.<br>Region: Südostanatolien und Nordsyrien<br>Sprachen: Luwisch, Aramäisch, Phönizisch</div>
<p>Als <b>späthethitische Fürstentümer</b> (englisch <i>Neo-Hittite states</i>, auch „syro-hethitische Staaten“) bezeichnet man eine Gruppe von Kleinstaaten der frühen Eisenzeit, die nach dem Untergang des hethitischen Großreichs um 1175 v. Chr. in Südostanatolien und Nordsyrien entstanden. Sie führten hethitisch-luwische Traditionen fort, vermischten sich aber zunehmend mit der aramäischen Bevölkerung der Region.</p>
<h2>Geschichte</h2>
<p>Nach dem Zusammenbruch des Großreichs der Hethiter überlebten in Karkemiš am Euphrat und in anderen Städten Zweige der hethitischen Königsfamilie und lokale Dynastien. Zu den bedeutendsten Fürstentümern gehörten Karkemiš, Melid (Malatya), Kummuh, Gurgum, Samʼal (Zincirli), Pattina/Unqi, Hamat und Que (Kilikien). Sie gerieten ab dem 9. Jahrhundert v. Chr. unter den wachsenden Druck des Neuassyrischen Reiches und wurden bis zum späten 8. Jahrhundert v. Chr. nacheinander als assyrische Provinzen eingegliedert.</p>
<h2>Kultur</h2>
<p>Kennzeichnend ist die monumentale Bildkunst: Relieforthostaten und Portalskulpturen (Löwen- und Sphingentore) schmückten Paläste und Stadttore. Inschriften wurden in luwischen Hieroglyphen, später zunehmend in aramäischer und phönizischer Alphabetschrift verfasst; zweisprachige Inschriften wie die von Karatepe waren für die Entzifferung des Hieroglyphenluwischen bedeutsam. Religiös wurde besonders der Wettergott verehrt.</p>
