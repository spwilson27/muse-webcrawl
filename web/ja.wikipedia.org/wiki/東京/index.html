<header><span class="brand">東京</span></header><main><h1>東京</h1><p>東京は日本の首都であり、最大の都市です。東京都は23の特別区と多摩地域、島嶼部からなり、都市圏全体では世界最大級の人口を抱えます。日本語版の記事では、江戸から東京への歴史、地理、行政、経済、交通、観光が解説されています。</p>
<div class="imgph">[Image: 東京スカイツリーと市街地]</div><section><h2>名所</h2><p>東京スカイツリー、浅草寺、明治神宮、皇居、渋谷や新宿の繁華街などが代表的な名所です。</p></section></main>
