<header><span class="brand">日本</span></header><main><h1>日本</h1><p><i></i></p><p>日本は、東アジアに位置する島国で、首都は東京です。人口は約1億2千万人で、本州、北海道、九州、四国など多くの島々からなります。</p>
<div class="imgph"><img src="images/mount-fuji.png" alt="Recreated from memory: 日本の地図と富士山" style="max-width:100%;height:auto"><br>[Image: 日本の地図と富士山]</div><section><h2>地理と歴史</h2><p>日本は環太平洋造山帯にあり、山地が多く地震や火山活動も活発です。歴史は古代の律令国家から武家政権、明治維新、第二次世界大戦後の復興と経済成長へと続きます。</p></section><section><h2>政治と文化</h2><p>立憲君主制と議院内閣制をとり、天皇は国の象徴です。伝統文化と現代のポップカルチャーの両方で世界的に知られています。</p></section></main>
