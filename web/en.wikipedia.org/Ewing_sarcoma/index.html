<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Ewing sarcoma - Wikipedia</title><style>body{font-family:sans-serif;max-width:900px;margin:0 auto;padding:20px;line-height:1.6;color:#202122}h1{border-bottom:1px solid #a2a9b1}img{max-width:100%;background:#eaecf0;padding:40px;display:block}</style></head><body><h1>Ewing sarcoma</h1><img src="images/Ewing_sarcoma.png" alt="Histology of Ewing sarcoma"><p><b>Ewing sarcoma</b> is a type of cancer arising in bone or soft tissue, most commonly in children and adolescents. Described by James Ewing in 1921, it is characterised by a translocation involving the EWSR1 gene, and is treated with chemotherapy, surgery and radiation.</p></body></html>
