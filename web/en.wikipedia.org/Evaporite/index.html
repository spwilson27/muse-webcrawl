<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Evaporite - Wikipedia</title><style>body{font-family:sans-serif;max-width:900px;margin:0 auto;padding:20px;line-height:1.6;color:#202122}h1{border-bottom:1px solid #a2a9b1}img{max-width:100%;background:#eaecf0;padding:40px;display:block}</style></head><body><h1>Evaporite</h1><img src="images/Evaporite.png" alt="Evaporite salt deposits"><p>An <b>evaporite</b> is a sedimentary rock formed by evaporation of water and precipitation of dissolved minerals, including halite, gypsum and anhydrite. Evaporites form in arid basins and are important sources of salt and potash.</p></body></html>
