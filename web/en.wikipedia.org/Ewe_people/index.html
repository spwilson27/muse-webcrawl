<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Ewe people - Wikipedia</title><style>body{font-family:sans-serif;max-width:900px;margin:0 auto;padding:20px;line-height:1.6;color:#202122}h1{border-bottom:1px solid #a2a9b1}img{max-width:100%;background:#eaecf0;padding:40px;display:block}</style></head><body><h1>Ewe people</h1><img src="images/Ewe_people.png" alt="Ewe people in traditional dress"><p>The <b>Ewe people</b> are a Gbe-speaking ethnic group native to West Africa, mainly in southeastern Ghana, southern Togo and Benin. They speak the Ewe language and are known for rich drumming, music and textile traditions including kente weaving.</p></body></html>
