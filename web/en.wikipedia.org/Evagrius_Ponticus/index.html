<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Evagrius Ponticus - Wikipedia</title><style>body{font-family:sans-serif;max-width:900px;margin:0 auto;padding:20px;line-height:1.6;color:#202122}h1{border-bottom:1px solid #a2a9b1}img{max-width:100%;background:#eaecf0;padding:40px;display:block}</style></head><body><h1>Evagrius Ponticus</h1><img src="images/Evagrius_Ponticus.png" alt="Icon of Evagrius Ponticus"><p><b>Evagrius Ponticus</b> (345–399), also called Evagrius the Solitary, was a Christian monk and ascetic from Pontus. Known for his writings on prayer and ascetic life, he systematised lists of tempting thoughts that influenced the later doctrine of the seven deadly sins.</p></body></html>
