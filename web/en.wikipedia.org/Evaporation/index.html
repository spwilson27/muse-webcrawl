<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Evaporation - Wikipedia</title><style>body{font-family:sans-serif;max-width:900px;margin:0 auto;padding:20px;line-height:1.6;color:#202122}h1{border-bottom:1px solid #a2a9b1}img{max-width:100%;background:#eaecf0;padding:40px;display:block}</style></head><body><h1>Evaporation</h1><img src="images/Evaporation.png" alt="Water evaporating from a surface"><p><b>Evaporation</b> is a type of vaporisation that occurs on the surface of a liquid as it changes into the gas phase. Molecules with sufficient kinetic energy escape, cooling the remaining liquid. It is a key part of the water cycle.</p><p>See also: <a href="../Evaporite/index.html">Evaporite</a></p></body></html>
