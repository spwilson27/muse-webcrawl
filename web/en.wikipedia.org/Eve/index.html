<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Eve - Wikipedia</title><style>body{font-family:sans-serif;max-width:900px;margin:0 auto;padding:20px;line-height:1.6;color:#202122}h1{border-bottom:1px solid #a2a9b1}img{max-width:100%;background:#eaecf0;padding:40px;display:block}</style></head><body><h1>Eve</h1><img src="images/Eve.png" alt="Depiction of Eve in the Garden of Eden"><p><b>Eve</b> is a figure in the Book of Genesis, the first woman created by God according to the creation narrative, and the wife of Adam. In the story she eats the forbidden fruit in the Garden of Eden after being tempted by the serpent, leading to the Fall of man.</p></body></html>
